name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/embroidery-print-service-lakz9a, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # 本番Pagesへ出すのは「リポジトリのデフォルトブランチ」への push のみ。
    # （現在は作業ブランチがデフォルト。main をデフォルトに切り替えた後は
    #   自動的に main のみがデプロイされ、他ブランチの push は無視される）
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
